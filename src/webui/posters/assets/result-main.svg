<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" role="img" aria-labelledby="title desc">
  <title id="title">批量生成结果占位图</title>
  <desc id="desc">用于宣传海报的批量生成结果占位图</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#f0fdf4" />
      <stop offset="100%" stop-color="#ffffff" />
    </linearGradient>
    <linearGradient id="accent" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#22c55e" />
      <stop offset="100%" stop-color="#15803d" />
    </linearGradient>
  </defs>
  <rect width="800" height="1000" rx="40" fill="url(#bg)"/>
  <rect x="44" y="44" width="712" height="912" rx="32" fill="#ffffff" stroke="#bbf7d0" stroke-width="4"/>
  <text x="80" y="120" fill="#15803d" font-size="34" font-family="Microsoft YaHei, Noto Sans SC, sans-serif" font-weight="700">效果图占位 A</text>
  <text x="80" y="170" fill="#334155" font-size="22" font-family="Microsoft YaHei, Noto Sans SC, sans-serif">建议替换为：批量生成后的整体结果截图</text>
  <rect x="80" y="220" width="640" height="520" rx="28" fill="#f8fafc" stroke="#cbd5e1" stroke-dasharray="10 8"/>
  <g transform="translate(130 290)">
    <rect width="160" height="200" rx="18" fill="#dcfce7"/>
    <rect x="180" width="160" height="200" rx="18" fill="#bbf7d0"/>
    <rect x="360" width="160" height="200" rx="18" fill="#dcfce7"/>
    <rect x="90" y="220" width="160" height="200" rx="18" fill="#bbf7d0"/>
    <rect x="270" y="220" width="160" height="200" rx="18" fill="#dcfce7"/>
  </g>
  <rect x="80" y="790" width="640" height="110" rx="24" fill="url(#accent)" opacity="0.12"/>
  <text x="110" y="845" fill="#14532d" font-size="26" font-family="Microsoft YaHei, Noto Sans SC, sans-serif" font-weight="700">把你的真实成品截图替换到这里</text>
  <text x="110" y="885" fill="#334155" font-size="20" font-family="Microsoft YaHei, Noto Sans SC, sans-serif">文件建议名：result-main.svg 或同步修改 HTML 中的路径</text>
</svg>
