<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" role="img" aria-labelledby="title desc">
  <title id="title">模板区域占位图</title>
  <desc id="desc">用于宣传海报的模板区域占位图</desc>
  <defs>
    <linearGradient id="bg2" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f0fdf4" />
    </linearGradient>
  </defs>
  <rect width="800" height="1000" rx="40" fill="url(#bg2)"/>
  <rect x="48" y="48" width="704" height="904" rx="32" fill="#ffffff" stroke="#bbf7d0" stroke-width="4"/>
  <text x="80" y="120" fill="#15803d" font-size="34" font-family="Microsoft YaHei, Noto Sans SC, sans-serif" font-weight="700">效果图占位 B</text>
  <text x="80" y="170" fill="#334155" font-size="22" font-family="Microsoft YaHei, Noto Sans SC, sans-serif">建议替换为：模板区域或字段占位符截图</text>
  <rect x="92" y="230" width="616" height="620" rx="28" fill="#f8fafc" stroke="#cbd5e1"/>
  <g font-family="Consolas, Microsoft YaHei, monospace">
    <rect x="130" y="290" width="540" height="80" rx="16" fill="#dcfce7"/>
    <text x="160" y="338" fill="#14532d" font-size="28">&lt;&lt;姓名&gt;&gt;   &lt;&lt;编号&gt;&gt;   &lt;&lt;部门&gt;&gt;</text>
    <rect x="130" y="410" width="540" height="80" rx="16" fill="#ecfccb"/>
    <text x="160" y="458" fill="#3f6212" font-size="28">模板区域：A1:H14</text>
    <rect x="130" y="530" width="540" height="80" rx="16" fill="#dcfce7"/>
    <text x="160" y="578" fill="#14532d" font-size="28">分页字段：部门 / 类别</text>
    <rect x="130" y="650" width="540" height="80" rx="16" fill="#ecfccb"/>
    <text x="160" y="698" fill="#3f6212" font-size="28">每行个数：3</text>
  </g>
  <text x="110" y="900" fill="#334155" font-size="20" font-family="Microsoft YaHei, Noto Sans SC, sans-serif">文件建议名：result-template.svg 或同步修改 HTML 中的路径</text>
</svg>
